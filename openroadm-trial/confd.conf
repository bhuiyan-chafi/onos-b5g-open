<confdConfig xmlns="http://tail-f.com/ns/confd_cfg/1.0">
  <loadPath><dir>./confd</dir></loadPath>
  <stateDir>./data/state</stateDir>

  <!-- Explicitly control datastores -->
  <datastores>
    <running>  
      <access>read-write</access>
    </running>
    <candidate>
      <enabled>false</enabled>
    </candidate>
    <startup>
      <enabled>false</enabled>
    </startup>
  </datastores>

  <cdb>
   <operational>
      <enabled>true</enabled>
    </operational>
    <enabled>true</enabled>
    <dbDir>./data/cdb</dbDir>
  </cdb>

  <netconf>
    <enabled>true</enabled>
    <transport>
      <ssh>
        <enabled>true</enabled>
        <ip>0.0.0.0</ip>
        <port>830</port>
      </ssh>
    </transport>
    <capabilities>
      <writable-running/>
      <validate/>
      <!-- no <candidate/>, no <startup/> -->
    </capabilities>
  </netconf>

  <aaa>
    <sshServerKeyDir>./data/ssh</sshServerKeyDir>
  </aaa>
</confdConfig>